<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palmares - 1102</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>🏆 Copa 1102 🏆</h1>
        <p>"La grandez se escribe a cada minuto"</p>
    </header>

    <div class="news-ticker" id="news-container" style="display: none;">
        <span class="news-label">🚨 ÚLTIMA HORA</span>
        <div id="news-marquee" class="news-content"></div>
    </div>

    <main>
        <div class="teams-grid" id="teams-grid">
            <!-- Los escudos se generarán aquí con JavaScript -->
        </div>

        <section class="ranking-section">
            <h2>⭐ Ranking Histórico Oficial</h2>
            <div class="table-responsive">
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Equipo</th>
                            <th>Pts</th>
                            <th title="Campeonatos (3 pts)">🥇</th>
                            <th title="Subcampeonatos (2 pts)">🥈</th>
                            <th title="Terceros Puestos (1 pt)">🥉</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-body">
                        <!-- Llenado con JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal para detalles del equipo -->
    <div id="team-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div class="modal-layout">
                <!-- Columna Izquierda: Logo y Nombre -->
                <div class="modal-left">
                    <div id="modal-stars-container" class="stars-container"></div>
                    <img id="modal-logo" src="" alt="Escudo">
                    <h2 id="modal-team-name">
                        <span id="name-text">Nombre del Equipo</span>
                    </h2>
                    <p id="modal-team-desc" class="team-description"></p>
                    
                    <div class="rival-section" id="modal-rival-section" style="display: none;">
                        <h4>⚔️ Máximo Rival</h4>
                        <img id="modal-rival-logo" src="" alt="Escudo Rival" class="rival-logo">
                        <span id="modal-rival-name" class="rival-name"></span>
                        
                        <!-- Mini tabla de stats -->
                        <div class="rival-stats-grid" id="modal-rival-stats">
                            <div class="r-stat"><span class="r-val" id="r-w">0</span><span class="r-lbl">PG</span></div>
                            <div class="r-stat"><span class="r-val" id="r-l">0</span><span class="r-lbl">PP</span></div>
                        </div>
                    </div>

                    <div class="records-section" id="modal-records-section" style="display: none;">
                        <h4>📊 Récords</h4>
                        <p class="record-item" id="biggest-win-container"><strong>Mayor Goleada Hecha:</strong> <br><span id="biggest-win-text"></span></p>
                        <p class="record-item" id="biggest-loss-container"><strong>Mayor Goleada Recibida:</strong> <br><span id="biggest-loss-text"></span></p>
                    </div>

                    <div class="badges-section" id="modal-badges-section" style="display: none;">
                        <h4>🏅 Insignias</h4>
                        <div id="modal-badges-container" class="badges-container">
                            <!-- JS fills this -->
                        </div>
                    </div>
                </div>

                <!-- Columna Derecha: Vitrina -->
                <div class="modal-right vitrina-container">
                    <div class="shelf shelf-oro" id="shelf-oro">
                        <!-- Trophies appended by JS -->
                    </div>
                    <div class="shelf shelf-plata" id="shelf-plata">
                    </div>
                    <div class="shelf shelf-bronce" id="shelf-bronce">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Popover para detalles del trofeo -->
    <div id="trophy-popover" class="popover hidden">
        <span class="close-popover" id="close-popover">&times;</span>
        <h4 id="popover-title">Copa</h4>
        <div class="popover-match">
            <img id="popover-home-logo" src="" alt="Home">
            <div class="popover-score">
                <span id="popover-result">3 - 1</span>
            </div>
            <img id="popover-away-logo" src="" alt="Away">
        </div>
        <p id="popover-note"></p>
    </div>

    <script src="data.js"></script>
    <script type="module" src="app.js"></script>
</body>

</html>
